<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Dayfill — a year filling up, one day at a time." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Dayfill</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="menuButton" aria-label="메뉴 열기" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="wordmark" id="homeButton" aria-label="홈으로">Dayfill</button>
        <div class="header-actions">
          <button class="icon-button" id="refreshButton" aria-label="새로고침"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg></button>
          <div class="language-wrap">
          <button class="icon-button globe" id="languageButton" aria-label="언어 변경" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.46 3.65 5.46 3.65 9S14.4 18.54 12 21c-2.4-2.46-3.65-5.46-3.65-9S9.6 5.46 12 3Z"/></svg></button>
          <div class="language-popover" id="languagePopover" hidden>
            <button data-language="ko">한국어</button>
            <button data-language="en">English</button>
          </div>
          </div>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
      <footer><span>Dayfill</span><p data-i18n="footer">당신의 시간은 채워지고 있어요.</p></footer>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="side-menu" id="sideMenu" aria-hidden="true">
      <div class="menu-head">
        <div><small>Dayfill</small><strong id="menuYear"></strong></div>
        <button class="icon-button close" id="closeMenu" aria-label="메뉴 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <nav id="monthNavigation" aria-label="월별 보기"></nav>
      <div class="past-years">
        <p data-i18n="pastYears">지난 연도</p>
        <div id="pastYears"></div>
      </div>
    </aside>

    <dialog id="confirmDialog">
      <h2 data-i18n="deleteTitle">기록을 삭제할까요?</h2>
      <p data-i18n="deleteBody">사진과 짧은 기록이 이 기기에서 삭제됩니다.</p>
      <div class="dialog-actions">
        <button class="button ghost" id="cancelDelete" data-i18n="cancel">취소</button>
        <button class="button danger" id="confirmDelete" data-i18n="delete">삭제</button>
      </div>
    </dialog>

    <div class="update-toast" id="updateToast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
