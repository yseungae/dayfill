<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3eb" />
    <meta name="description" content="A year filling up, one day at a time." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Time Tattery</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="menuButton" aria-label="메뉴 열기" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <button class="wordmark" id="homeButton" aria-label="홈으로">TIME <i>TATTERY</i></button>
        <div class="language-wrap">
          <button class="icon-button globe" id="languageButton" aria-label="언어 변경" aria-expanded="false">◎</button>
          <div class="language-popover" id="languagePopover" hidden>
            <button data-language="ko">한국어</button>
            <button data-language="en">English</button>
          </div>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
      <footer><span>TT</span><p data-i18n="footer">당신의 시간은 채워지고 있어요.</p></footer>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="side-menu" id="sideMenu" aria-hidden="true">
      <div class="menu-head">
        <div><small>TIME TATTERY</small><strong id="menuYear"></strong></div>
        <button class="icon-button close" id="closeMenu" aria-label="메뉴 닫기">×</button>
      </div>
      <nav id="monthNavigation" aria-label="월별 보기"></nav>
      <div class="past-years">
        <p data-i18n="pastYears">지난 연도</p>
        <div id="pastYears"></div>
      </div>
    </aside>

    <dialog id="confirmDialog">
      <h2 data-i18n="deleteTitle">기록을 삭제할까요?</h2>
      <p data-i18n="deleteBody">사진과 짧은 기록이 이 기기에서 삭제됩니다.</p>
      <div class="dialog-actions">
        <button class="button ghost" id="cancelDelete" data-i18n="cancel">취소</button>
        <button class="button danger" id="confirmDelete" data-i18n="delete">삭제</button>
      </div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
